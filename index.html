<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <nav class="nav-menu">
            <div class="logo">文档中心</div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="搜索文档...">
            </div>
        </nav>

        <div class="hero-section">
            <h1 class="animate__animated animate__fadeIn">欢迎来到文档中心</h1>
            <p class="animate__animated animate__fadeIn animate__delay-1s">在这里，您可以找到所有需要的技术文档和指南</p>
        </div>

        <div class="docs-grid">
            <div class="doc-card animate__animated animate__fadeInUp">
                <div class="doc-icon">📝</div>
                <h3>Markdown 手册</h3>
                <p>学习 Markdown 语法和最佳实践</p>
                <a href="markdown-manual.md" class="doc-link">查看文档</a>
            </div>

            <div class="doc-card animate__animated animate__fadeInUp animate__delay-1s">
                <div class="doc-icon">🔄</div>
                <h3>Git 手册</h3>
                <p>掌握 Git 版本控制系统</p>
                <a href="git-manual.md" class="doc-link">查看文档</a>
            </div>

            <div class="doc-card animate__animated animate__fadeInUp animate__delay-2s">
                <div class="doc-icon">🐧</div>
                <h3>Linux 手册</h3>
                <p>Linux 系统使用指南</p>
                <a href="linux-manual.md" class="doc-link">查看文档</a>
            </div>

            <div class="doc-card animate__animated animate__fadeInUp animate__delay-3s">
                <div class="doc-icon">🔄</div>
                <h3>GitHub Actions 手册</h3>
                <p>自动化工作流程指南</p>
                <a href="github-actions-manual.md" class="doc-link">查看文档</a>
            </div>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
